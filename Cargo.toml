[workspace]
resolver = "2"
members = [
    "crates/pattern-core",
    "crates/pattern-render",
    "crates/motif-ingest",
    "crates/pattern-io",
    "crates/pattern-doc",
    "crates/pattern-cli",
    "app/src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
pattern-core = { path = "crates/pattern-core" }
pattern-render = { path = "crates/pattern-render" }
motif-ingest = { path = "crates/motif-ingest" }
pattern-doc = { path = "crates/pattern-doc" }
pattern-io = { path = "crates/pattern-io" }

glam = { version = "0.33", features = ["serde"] }
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tiny-skia = "0.12"
png = "0.18"
clap = { version = "4.6", features = ["derive"] }
visioncortex = "0.9.3"
# Geometry out of SVG, not SVG rendering. Default features off deliberately:
# `text` resolves type through the *installed system fonts*, so the same file
# would rasterise differently on two machines and the engine's determinism
# would be a claim it could no longer make. Text must be outlined before
# import, which the app says.
usvg = { version = "0.48.1", default-features = false }
# Rendering SVG, as distinct from reading geometry out of it. Only for the
# fallback: a drawing carrying a gradient has no outline that a palette slot
# could stand for, so it is rasterised and quantised like any other artwork.
# `text` stays off here for the same reason it is off for `usvg` — type
# resolved through installed fonts would rasterise differently on another
# machine.
resvg = { version = "0.48.1", default-features = false }
tiny-skia-path = "0.12"

[profile.dev]
# Portfolio-wide fix for target/ ballooning; see ~/Projects/TAURI_BUILD_ARTIFACTS.md
debug = "line-tables-only"

# The engine crates are optimised even in a development build.
#
# `npm run tauri dev` runs an unoptimised binary, and the preview re-renders on
# every slider movement — so the difference between a build that feels
# immediate and one that feels stuck is entirely down to this. Measured on a
# 1.2 m repeat of four thousand motifs: 3.4 seconds an interaction unoptimised,
# 0.2 optimised. A designer trying the tool in dev was hitting the first one.
#
# Only the engine and its dependencies. The app crate itself stays unoptimised,
# because it is the one being edited and its compile time is what a rebuild
# costs; it does no per-pixel work worth optimising.
[profile.dev.package.pattern-core]
opt-level = 2
[profile.dev.package.pattern-render]
opt-level = 2
[profile.dev.package.motif-ingest]
opt-level = 2
[profile.dev.package.pattern-io]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
