# Everything the project claims about itself, checked on every push.
#
# Two things worth knowing about the shape of this.
#
# It runs on Linux while development happens on macOS, which is deliberate
# rather than incidental. Determinism across platforms is a stated invariant
# and has never been verified: the golden images and the byte-identical
# render tests have only ever run on one machine. Running them on a second
# architecture is the cheapest evidence available, and if they disagree that
# is a finding rather than a reason to loosen the test.
#
# It uses no third-party actions. `actions/checkout`, `actions/cache` and
# `actions/setup-node` are GitHub's own; the usual Rust caching action is not,
# and an action with write access to the build cache is exactly the supply
# chain risk the house rules ask to pause over. Hand-rolling the cache is a few
# more lines and introduces no new trust.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because the audit below asks a question whose answer changes
  # without the code changing. An advisory published against a dependency we
  # have not touched is exactly the case a push-triggered run never sees.
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  # A backtrace is worth more than a line number when a test fails on a machine
  # nobody can attach a debugger to.
  RUST_BACKTRACE: 1

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace includes the Tauri shell, so the whole thing needs
      # webkit's development headers to compile even though no window is ever
      # opened. This is Tauri v2's documented Debian prerequisite set.
      - name: Install the desktop shell's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # The toolchain file pins the version; this only makes sure the two
      # components it names are present.
      - name: Show the toolchain
        run: |
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      # `--locked` so a dependency cannot drift underneath the build: the
      # lockfile is the record of what the tests were last green against.
      - name: Tests
        run: cargo test --workspace --locked

      - name: Documentation links
        run: python3 scripts/check-docs.py

  app:
    name: App shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile
      # and fails if the two have diverged, which is the point of having one.
      - name: Install
        working-directory: app
        run: npm ci

      # The project's own scripts, which is what a developer runs. CI running
      # the same commands is one less thing that can be true in one place and
      # not the other.
      - name: Component tests
        working-directory: app
        run: npm test

  # Known vulnerabilities in what we depend on, which is a different question
  # from whether our own code is right and has a different half-life: this job
  # can go red on a morning when nothing was committed.
  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `cargo-audit` is built from source rather than fetched through a
      # third-party action, for the reason at the top of this file: an action
      # with access to the build is the supply-chain risk the audit exists to
      # look for. `--locked` so the tool itself is built from its own lockfile.
      - name: Cache the audit tool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null; then
            cargo install cargo-audit --locked
          fi
          cargo audit --version

      # Vulnerabilities fail the job; unmaintained and unsound crates are
      # printed and do not. That is not laxity: measured on 2026-09-29 the
      # tree carries seven such warnings and every one of them is inside
      # Tauri's own transitive dependencies: glib, proc-macro-error, the unic
      # family. Failing on them would put the job permanently red for
      # something this project cannot fix, and a permanently red job is one
      # nobody reads on the morning it turns red for a real reason.
      #
      # `cargo audit` already exits non-zero on an actual vulnerability, so
      # this is the default and the reasoning is the thing worth writing down.
      - name: Rust advisories
        run: cargo audit

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      # Production dependencies only. A development-only advisory is worth
      # knowing about and is not a reason to fail a build that ships none of
      # it; `npm audit` without this fails on the test tooling's transitive
      # tree and teaches everyone to ignore the job.
      - name: Front-end advisories
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build
        working-directory: app
        run: npm run build
